name: Greenroom
options:
  bundleIdPrefix: com.sibhimanyu.greenroom
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # Bumped from 13.0 - only reason was to unlock @Environment(\.openSettings)
    # (macOS 14+) for a real Settings button instead of the private
    # `showSettingsWindow:` selector trick it replaced. Nothing else here
    # needs anything past 13.0.
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # A free/personal Apple ID team is enough now - this app has no System
    # Extension entitlement (OBS owns the actual virtual camera), so it
    # isn't subject to the paid-Developer-Program-only restriction that
    # blocked the earlier CMIOExtension-based design.
    #
    # Set to the personal team (from the Apple Development cert's OU) so
    # every rebuild carries the SAME signing identity. With the previous
    # ad-hoc signing, each build had a fresh signature, so macOS treated
    # every rebuild as a different app trying to read the Keychain item the
    # last build wrote - hence a password prompt on every single launch.
    DEVELOPMENT_TEAM: "R5H6Z6H9Y7"

# Sparkle: auto-updates for installed copies. The appcast lives at
# docs/appcast.xml (served by GitHub Pages at the SUFeedURL in
# App/Info.plist); each release zip is EdDSA-signed with the key in the
# login Keychain (generated by Sparkle's generate_keys - back it up, it
# is the only thing that can sign updates). scripts/release.sh runs the
# whole ritual.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  # Zoho Apptics, via SPM rather than the CocoaPods integration its docs
  # recommend. CocoaPods writes into Greenroom.xcodeproj, which is gitignored
  # and regenerated from this file - scripts/release.sh runs `xcodegen
  # generate` immediately before building, so a Pods integration would be
  # silently erased and release builds would ship with no analytics in them.
  # Pinned to an exact tag: the repo's default branch carries a Package.swift
  # whose version string disagrees with its own tags.
  Apptics:
    url: https://github.com/zoho/Apptics
    exactVersion: 3.3.17

targets:
  Greenroom:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_NAME: Greenroom
        PRODUCT_BUNDLE_IDENTIFIER: com.sibhimanyu.greenroom
        # Bump alongside each GitHub release tag (vX.Y.Z).
        MARKETING_VERSION: "0.3.8"
        CURRENT_PROJECT_VERSION: "14"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        # Brand mark (App/Assets.xcassets) - regenerate the PNGs with the
        # vector script if the logo ever changes; see Branding/.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Brand green (#5FA83C) as the global accent: pills, buttons,
        # toggles, selection all carry the brand instead of system blue
        # (design-review F1 - the app had no accent identity).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Camera + mic entitlements - Hardened Runtime silently blocks both
        # without them (black video in the built-in meeting client).
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        # `import ZoomSDK` needs the compiler to find ZoomSDK.framework at
        # build time - the other ~80 frameworks/dylibs/bundles/apps it
        # ships alongside (Vendor/ZoomSDK/) are ZoomSDK.framework's own
        # runtime dependencies, not something Greenroom's code references
        # directly, so they're embedded via the postbuildScripts step below
        # instead of being individually declared here.
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Vendor/ZoomSDK"]
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
    dependencies:
      - framework: Vendor/ZoomSDK/ZoomSDK.framework
        embed: true
      - package: Sparkle
      - package: Apptics
        # ...coreWithKSCrash, NOT plain AppticsAnalytics. The latter declares its
        # crash reporter as `.target(name: "AppticsMXCrashKit", condition:
        # .when(platforms: [.iOS]))`, so a macOS build of it links NO crash
        # reporter at all - it resolves and compiles perfectly while silently
        # reporting nothing. This product takes AppticsCrashKit + KSCrash
        # unconditionally, both of which ship macos-arm64_x86_64 slices.
        # Crashes bill as "Errors", which the free plan covers (5K/month).
        product: AppticsAnalyticscoreWithKSCrash
    # Apptics needs a build-time step, which is what its CocoaPods
    # `script_phase` provides. SPM has no equivalent, so the vendored copy of
    # the same script runs here instead (see Vendor/Apptics/README.md).
    #
    # Guarded on the config file existing. Without the guard, anyone who has
    # not created apptics-config.plist - a fresh clone, or CI - gets a hard
    # build failure from inside a third-party script, which is a miserable way
    # to discover a missing credential.
    preBuildScripts:
      - name: Apptics pre build
        basedOnDependencyAnalysis: false
        script: |
          CONFIG="${SRCROOT}/apptics-config.plist"
          if [ ! -f "$CONFIG" ]; then
            echo "warning: apptics-config.plist not found - skipping Apptics registration. Copy apptics-config.plist.example and add your API key to enable analytics."
            exit 0
          fi
          # Also skip while the key is still the placeholder. Apptics' script
          # treats any non-empty API_KEY as real, calls the register endpoint,
          # gets a non-200 and exits 1 - so without this check, merely creating
          # the config file from the template breaks the build.
          AP_KEY=$(/usr/libexec/PlistBuddy -c "Print API_KEY" "$CONFIG" 2>/dev/null || true)
          case "$AP_KEY" in
            ""|PASTE_YOUR_APPTICS_API_KEY_HERE)
              echo "warning: apptics-config.plist still holds the placeholder API_KEY - skipping Apptics registration. Paste your real key to turn analytics on."
              exit 0
              ;;
          esac
          # --preserve-app-metadata-in-config=1: keep APP_VERSION_META in the
          # config after the build. Apptics defaults to stripping it, which
          # makes sense for teams who COMMIT their config and do not want build
          # metadata churning in git. Ours is gitignored, so there is nothing to
          # churn - and stripping it means the script re-registers the version
          # against Apptics' server on every single build, which costs a network
          # round trip each time and fails the build when offline.
          sh "${SRCROOT}/Vendor/Apptics/scripts/run" \
            --upload-symbols-for-configurations="Release" \
            --preserve-app-metadata-in-config=1
    # Confirmed against the real downloaded SDK (7.1.5.84750): it ships
    # ZoomSDK.framework alongside ~37 more support frameworks, 11 flat
    # dylibs, 28 resource bundles, and 6 helper .app bundles (screen-share
    # host, transcode, etc.) that ZoomSDK.framework loads at runtime. Xcode
    # only auto-embeds+signs what's declared above (ZoomSDK.framework
    # itself); this script copies everything else into the same
    # Frameworks folder and signs it, since ENABLE_HARDENED_RUNTIME
    # requires every embedded binary to carry a valid signature or the
    # app won't launch. Confirmed working: repeated xcodebuild + launch
    # cycles with no dyld errors, and a real Meeting SDK join succeeding.
    postbuildScripts:
      # Not declared as a resource in `sources`: the file is gitignored, and
      # xcodegen's `optional` only suppresses the generate-time error - the
      # copy phase still fails the build when it is missing. Copying it here
      # keeps a clone without an API key buildable.
      #
      # It has to reach the bundle because the SDK reads it at runtime, by the
      # name the pre-build script wrote into Info.plist as AP_INFOPLIST_FILE.
      # That also means API_KEY ships inside every released app - confirmed by
      # the runtime binary referencing the key, so it cannot be stripped. It is
      # how Apptics is designed; treat that key as public once you ship.
      - name: Copy Apptics config into the bundle
        script: |
          set -eu
          if [ -f "${SRCROOT}/apptics-config.plist" ]; then
            cp "${SRCROOT}/apptics-config.plist" "${CODESIGNING_FOLDER_PATH}/Contents/Resources/apptics-config.plist"
          fi
      - name: Embed remaining ZoomSDK support binaries
        script: |
          set -eu
          DEST="${CODESIGNING_FOLDER_PATH}/Contents/Frameworks"
          SRC="${SRCROOT}/Vendor/ZoomSDK"
          mkdir -p "$DEST"
          # Every framework Xcode itself embeds must be listed here, or
          # --delete erases it and the app dies at launch with a dyld
          # "Library not loaded" (v0.3.0 shipped that way: Sparkle was
          # embedded by Xcode, wiped by this rsync, crash on open).
          # Apptics contributes six via AppticsAnalyticscoreWithKSCrash:
          # Apptics, JWT, AppticsEventTracker, AppticsScreenTracker, and the
          # crash reporter pair AppticsCrashKit + KSCrash. (AppticsMXCrashKit is
          # iOS-only and never appears, which is why the plain AppticsAnalytics
          # product would leave macOS with no crash reporting.)
          XCODE_EMBEDS=" ZoomSDK.framework Sparkle.framework Apptics.framework JWT.framework AppticsEventTracker.framework AppticsScreenTracker.framework AppticsCrashKit.framework KSCrash.framework "
          # Fail the build rather than repeat that bug silently. Anything in
          # the bundle that neither came from Vendor/ZoomSDK nor is on the
          # list above is about to be deleted, so say so now instead of
          # letting it crash on someone's Mac at launch.
          for existing in "$DEST"/*.framework; do
            [ -e "$existing" ] || continue
            name=$(basename "$existing")
            case "$XCODE_EMBEDS" in
              *" $name "*) continue ;;
            esac
            if [ ! -e "$SRC/$name" ]; then
              echo "error: $name is embedded by Xcode but missing from XCODE_EMBEDS in project.yml. The rsync below would delete it and the app would crash at launch with a dyld error. Add it to the list."
              exit 1
            fi
          done
          EXCLUDES=""
          for name in $XCODE_EMBEDS; do EXCLUDES="$EXCLUDES --exclude $name"; done
          rsync -a --delete $EXCLUDES "$SRC/" "$DEST/"
          # Sparkle and the Apptics frameworks are excluded from this re-sign:
          # Xcode already signs them correctly, and a --deep re-sign flattens
          # the nested signatures on Sparkle's XPC services/helpers, which
          # breaks updates.
          find "$DEST" -mindepth 1 -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" -o -name "*.bundle" -o -name "*.app" \) \
            -not -name "Sparkle.framework" \
            -not -name "Apptics.framework" -not -name "JWT.framework" \
            -not -name "AppticsEventTracker.framework" -not -name "AppticsScreenTracker.framework" \
            -not -name "AppticsCrashKit.framework" -not -name "KSCrash.framework" -print0 \
            | xargs -0 -I{} codesign --force --deep --timestamp=none --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "{}"

schemes:
  Greenroom:
    build:
      targets:
        Greenroom: all
    run:
      config: Debug
