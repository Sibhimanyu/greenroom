<!doctype html><html><head><meta charset="utf-8"><title>Mock: Embed page with the Meeting SDK switch (sample, not Zoom's)</title>
<style>body{font:14px -apple-system,system-ui,sans-serif;margin:0;display:flex;background:#f4f5f7;color:#222;min-height:420px}
 div.nav{width:200px;background:#fff;padding:24px;line-height:2.2}div.nav a{display:block;color:#222;text-decoration:none}main{padding:30px 40px}
 .MuiSwitch-root{display:inline-block;width:44px;height:24px}</style></head><body>
<div class="nav"><a href="#">Basic information</a><a href="#">Surface</a><a href="#">Embed</a><a href="#">Scopes</a></div>
<main><h1>Embed</h1><div class="row"><span class="MuiSwitch-root"><span><span><input type="checkbox" id="sw" style="width:44px;height:24px"></span></span></span> <b>Meeting SDK</b></div>
<p><button id="regen">Regenerate</button> <button id="del">Delete app</button></p></main>
<script>
 var st = window.__state = {on:false, toggles:0, regen:0, del:0};
 var $ = function(i){return document.getElementById(i)};
 $('sw').onchange=function(){st.toggles++; st.on=$('sw').checked};
 $('regen').onclick=function(){st.regen++}; $('del').onclick=function(){st.del++};
</script></body></html>
