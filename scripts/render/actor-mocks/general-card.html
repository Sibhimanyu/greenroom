<!doctype html><html><head><meta charset="utf-8"><title>Mock: General app credentials card, copy on hover (sample, not Zoom's)</title>
<style>
 body{font:14px -apple-system,system-ui,sans-serif;margin:0;padding:24px 30px;background:#f4f5f7;color:#222;width:320px}
 .card{background:#fff;border:1px solid #e3e6ea;border-radius:10px;padding:14px 16px}
 .r{display:flex;justify-content:space-between;gap:12px;padding:6px 0;align-items:center}.r div:first-child{color:#6b7280}
 button{margin-left:6px}
</style></head><body>
<div class="card"><h4>App credentials &middot; Development</h4>
 <div class="r" id="rc"><div>Client ID</div><div><span>209M70PLQb2LycAbCdEf1</span></div></div>
 <div class="r" id="rs"><div>Client secret</div><div><span>&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span><span id="ctl"></span></div></div></div>
<script>
 var st = window.__state = {copied: 0, view: 0, hovered: 0};
 document.getElementById('rs').addEventListener('mouseover', function(){
   if (document.getElementById('ctl').children.length) return; st.hovered++;
   var v = document.createElement('button'); v.setAttribute('aria-label','View'); v.textContent='View'; v.onclick=function(){ st.view++ };
   var c = document.createElement('button'); c.setAttribute('aria-label','Copy'); c.textContent='Copy'; c.onclick=function(){ st.copied++ };
   document.getElementById('ctl').appendChild(v); document.getElementById('ctl').appendChild(c);
 });
</script></body></html>
