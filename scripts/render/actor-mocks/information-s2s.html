<!doctype html><html><head><meta charset="utf-8"><title>Mock: S2S Information page with both sections (sample, not Zoom's)</title>
<style>body{font:14px -apple-system,system-ui,sans-serif;padding:24px 40px;background:#f4f5f7;color:#222;width:600px}
 label{display:block;margin:12px 0 4px}input{width:100%;padding:8px;box-sizing:border-box}.err{border:1px solid #d32f2f}.msg{color:#d32f2f;font-size:12px}</style></head><body>
<h2>Basic Information</h2>
<label for="an">App Name *</label><input id="an" type="text" value="Greenroom Hosting" required>
<label for="sd">Short Description *</label><input id="sd" type="text" class="err" required><div class="msg">This field cannot be empty</div>
<label for="cn">Company Name *</label><input id="cn" type="text" required>
<h2>Developer Contact Information</h2>
<div><label for="dn">Name *</label><input id="dn" type="text" required></div>
<div><label for="de">Email *</label><input id="de" type="text" value="me@example.com" required></div>
<p><button id="cont">Continue</button> <button id="regen">Regenerate</button></p>
</body></html>
