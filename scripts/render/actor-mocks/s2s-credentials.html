<!doctype html><html><head><meta charset="utf-8"><title>Mock: S2S App Credentials (sample, not Zoom's)</title>
<style>
 body{font:14px -apple-system,system-ui,sans-serif;margin:0;padding:24px 40px;background:#f4f5f7;color:#222}
 .row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:12px 14px;margin:10px 0;width:720px}
 .row label{width:110px;color:#6b7280}.row input{flex:1;padding:8px;border:1px solid #d0d4da;border-radius:6px}
</style></head><body>
<h2>App Credentials</h2>
<div class="row"><div>Account ID</div><input id="a" type="text" readonly disabled><button class="cp" data-k="a">Copy</button></div>
<div class="row"><div>Client ID</div><input id="c" type="text" readonly><button class="cp" data-k="c">Copy</button></div>
<div class="row"><div>Client Secret</div><input id="s" type="password" readonly><button class="eye" aria-label="Show">Show</button><button class="cp" data-k="s">Copy</button></div>
<p><button id="regen">Regenerate</button></p>
<script>
 var st = window.__state = {copied: [], eye: 0, regen: 0};
 var V = {a:'AcctAAAAAAAAAAAAAAAAAA', c:'ClientBBBBBBBBBBBBBBB', s:'SecretCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC'};
 ['a','c','s'].forEach(function(k){ document.getElementById(k).value = V[k]; });
 document.querySelectorAll('.cp').forEach(function(b){ b.onclick=function(){ st.copied.push(b.dataset.k); }});
 document.querySelector('.eye').onclick=function(){ st.eye++ };
 document.getElementById('regen').onclick=function(){ st.regen++ };
 function blank(k){ document.getElementById(k).value=''; }
</script></body></html>
