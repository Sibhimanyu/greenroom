<!doctype html><html><head><meta charset="utf-8"><title>Mock: Scopes page with the Add Scopes panel (sample, not Zoom's)</title>
<style>
 body{font:14px -apple-system,system-ui,sans-serif;margin:0;padding:30px 40px;background:#f4f5f7;color:#222}
 table{border-collapse:collapse;width:640px;background:#fff}td{padding:10px;border-bottom:1px solid #e3e6ea}
 [role=dialog]{display:none;position:fixed;right:20px;top:20px;width:460px;height:520px;background:#fff;border-radius:12px;padding:20px;box-shadow:0 8px 40px rgba(0,0,0,.3);overflow:auto}
 li{list-style:none;padding:8px 0;border-bottom:1px solid #eee}li span{display:block;color:#6b7280;font-size:12px}
</style></head><body>
<h1>Scopes</h1><p><button id="add">+ Add Scopes</button> <button id="regen">Regenerate</button> <button id="del">Delete app</button></p>
<table id="tbl"></table>
<div role="dialog" id="dlg"><input id="q" placeholder="Search scopes" style="width:100%;padding:8px">
 <ul id="list"></ul><p><button id="cancel">Cancel</button> <button id="done">Done</button></p></div>
<script>
 var ALL = __SCOPES__;
 var OTHERS = ['meeting:read:summary:admin','user:read:list_users:admin','meeting:delete:recording:admin','report:read:list_meeting_participants:admin'];
 var DESC = {'meeting:delete:meeting:admin':'Delete a meeting'};
 var all = ALL.concat(OTHERS);
 var st = window.__state = {opened:0, ticked:[], saved:ALL.slice(0,2), regen:0, del:0, cancel:0, otherTicked:0, filterEvents:0, typed:[]};
 var $ = function(i){return document.getElementById(i)};
 function draw(){ $('tbl').innerHTML = st.saved.map(function(s){return '<tr><td>'+s+'</td></tr>'}).join(''); }
 draw();
 var q=$('q'), nativeGet=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').get, nativeSet=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;
 var tracked='';   // like React's value tracker: assigning through the instance hides the change from the input event
 Object.defineProperty(q,'value',{get:function(){return nativeGet.call(q)},set:function(v){tracked=v;nativeSet.call(q,v)}});
 var picked = {};
 function render(){ var f=nativeGet.call(q);
   $('list').innerHTML = all.filter(function(s){return !f||s.indexOf(f)>=0}).map(function(s){
     return '<li><label><input type="checkbox" data-s="'+s+'"'+(picked[s]?' checked':'')+'> '+s+'</label><span>'+(DESC[s]||'Scope')+'</span></li>'}).join('');
   document.querySelectorAll('#list input').forEach(function(c){c.onchange=function(){picked[c.dataset.s]=c.checked}});
 }
 q.addEventListener('input',function(){ if(nativeGet.call(q)===tracked) return; tracked=nativeGet.call(q); st.filterEvents++; st.typed.push(tracked); render(); });
 render();
 $('add').onclick=function(){st.opened++; $('dlg').style.display='block'};
 $('done').onclick=function(){ Object.keys(picked).forEach(function(s){ if(picked[s]){ if(ALL.indexOf(s)<0) st.otherTicked++; else {st.ticked.push(s); st.saved.push(s);} } }); draw(); $('dlg').style.display='none'};
 $('cancel').onclick=function(){st.cancel++; $('dlg').style.display='none'};
 $('regen').onclick=function(){st.regen++}; $('del').onclick=function(){st.del++};
</script></body></html>
