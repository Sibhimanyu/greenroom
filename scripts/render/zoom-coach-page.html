<!doctype html>
<html><head><meta charset="utf-8"><title>Mock of Zoom's "What kind of app are you creating" page (sample, not Zoom's)</title>
<meta name="color-scheme" content="light dark">
<style>
  body { font: 14px -apple-system, system-ui, sans-serif; margin: 0; padding: 40px 60px; background: #f4f5f7; color: #222; }
  @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #eee; } .card { background: #2a2a2c !important; border-color: #444 !important; } }
  h1 { font-size: 22px; margin: 0 0 24px; }
  .card { display: flex; align-items: flex-start; gap: 14px; background: #fff; border: 1px solid #d8dbe0; border-radius: 8px; padding: 18px 20px; margin-bottom: 14px; width: 640px; }
  .card b { display: block; font-size: 15px; margin-bottom: 4px; }
  .card span { color: #6b7280; }
  button { margin-top: 14px; padding: 8px 22px; border-radius: 6px; border: 0; background: #2d8cff; color: #fff; font-size: 14px; }
</style></head>
<body>
  <h1>What kind of app are you creating?</h1>
  <label class="card"><input type="radio" name="t"><div><b>General app</b><span>Use OAuth, embed the Meeting SDK, or build chatbots.</span></div></label>
  <label class="card"><input type="radio" name="t"><div><b>Server to server OAuth app</b><span>Call Zoom's API from your own server, no user sign-in.</span></div></label>
  <label class="card"><input type="radio" name="t"><div><b>Webhook only app</b><span>Receive events from Zoom.</span></div></label>
  <button>Create</button>
</body></html>
