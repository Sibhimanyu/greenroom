<!doctype html>
<html><head><meta charset="utf-8"><title>Mock of a passkey error page (sample, not Google's)</title>
<meta name="color-scheme" content="light dark">
<style>
  body { font: 14px -apple-system, system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; display: flex; justify-content: center; padding-top: 60px; min-height: 560px; }
  @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #eee; } .box { background: #2a2a2c !important; } }
  .box { background: #fff; border-radius: 12px; padding: 36px 40px; width: 420px; }
  h1 { font-size: 22px; font-weight: 400; margin: 0 0 12px; }
  p { color: #6b7280; line-height: 1.5; }
  .row { display: flex; justify-content: space-between; margin-top: 28px; }
  button { background: none; border: 0; color: #1a73e8; font-size: 14px; padding: 8px 12px; }
</style></head>
<body><div class="box"><h1>Something went wrong</h1><p>Make sure Bluetooth is on and your device is close to this computer, then try again.</p>
<div class="row"><button>Try another way</button><button>Try again</button></div></div></body></html>
